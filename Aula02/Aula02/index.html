<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">
    <title>Desafio das imagens</title>

</head>
<body>
    <h1>Desafio das imagens - Cidade Natal</h1>

    <h2>Cariacica - ES</h2>
    <img src="Cariacica.jpg" alt="Cariacica - ES" width="700px">
    
    <br>
    <br>
    <hr>
    <br>

    <picture>
        <img src="Orla de Cariacica.jpg" alt="Cariacica - ES" width="700px">
        <figcaption>Orla de Cariacica no ES</figcaption>
    </picture>

    <br>
    <hr>
    <br>

    <picture>
        <source media="(max-width:700px)" 
        srcset="cariacica_P.jpeg" width="500px">
        <img src="orla_G.jpg" alt="Cariacica - ES" width="700px">
    </picture>
    
    
</body>
</html>
