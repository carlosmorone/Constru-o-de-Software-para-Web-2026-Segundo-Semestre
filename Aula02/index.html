    <h3>Imagem que muda de tamanho</h3>

    <style>
        .paisagem {
            width: 800px;
            height: auto;
        }

        /* Quando a tela tiver até 760px */
        @media (max-width: 800px) {
            .paisagem {
                width: 400px;
            }
        }
    </style>
</head>

<body>

    <img 
        class="paisagem"
        src="Cariacica3.jpg"
        alt="Paisagem da cidade"
    >
    
    
</body>
