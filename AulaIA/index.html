
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para Estágio</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Inscrição para Vaga de Estágio</h1>
        <p>Preencha os campos abaixo para se candidatar.</p>
    </header>

    <main>
        <form action="/inscricao" method="post"
              enctype="multipart/form-data">

            <fieldset>
                <legend>Dados do candidato</legend>

                <div>
                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required
                        minlength="3"
                        maxlength="100
                    ">
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="celular">Celular:</label>
                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        autocomplete="tel"
                        required
                        placeholder="(11) 99999-9999"
                        pattern="\(?[0-9]{2}\)?[ ]?[0-9]{4,5}-?[0-9]{4}"
                        title="Informe um celular com DDD."
                    >
                </div>

                <div>
                    <label for="area">Área de interesse:</label>
                    <select
                        id="area"
                        name="area"
                        autocomplete="off"
                        required
                    >
                        <option value="">Selecione uma área</option>
                        <option value="tecnologia">Tecnologia</option>
                        <option value="administracao">Administração</option>
                        <option value="marketing">Marketing</option>
                        <option value="recursos-humanos">Recursos Humanos</option>
                        <option value="financas">Finanças</option>
                    </select>
                </div>

                <div>
                    <label for="curriculo">Currículo em PDF:</label>
                    <input
                        type="file"
                        id="curriculo"
                        name="curriculo"
                        accept="application/pdf,.pdf"
                        required
                    >
                </div>
            </fieldset>

            <fieldset>
                <legend>Proteção de dados pessoais</legend>

                <div>
                    <input
                        type="checkbox"
                        id="consentimento"
                        name="consentimento"
                        value="aceito"
                        required
                    >
                    <label for="consentimento">
                        Li o aviso de privacidade e concordo com o
                        tratamento dos meus dados pessoais para
                        participação no processo seletivo.
                    </label>
                </div>
            </fieldset>

            <button type="submit">Enviar inscrição</button>
        </form>
    </main>

    <footer>
        <p>Processo seletivo de estágio.</p>
    </footer>
</body>
</html>
